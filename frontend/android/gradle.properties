# SMARTCARE+ Android Gradle Properties
# =====================================
# CRITICAL BUILD CONSTRAINTS - DO NOT MODIFY WITHOUT DISCUSSION

# ============================================
# MEMORY OPTIMIZATION (Prevent OOM on long builds)
# ============================================
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2048M

# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ============================================
# CRITICAL: Disable Incremental Compilation
# Fixes build failures between C: (SDK) and D: (Project) drives
# ============================================
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# ============================================
# BUILD PERFORMANCE
# ============================================
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Suppress Kotlin version warnings
kotlin.suppressExperimentalKotlinWarnings=true

# ============================================
# NETWORK TIMEOUTS (Fail Fast)
# Prevents hanging on slow/unstable connections
# ============================================
systemProp.http.connectionTimeout=15000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=15000
systemProp.https.socketTimeout=30000

# ============================================
# OFFLINE MODE - Disabled for full build
# ============================================
# org.gradle.offline=true

# Suppress Java 8 source/target deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# ============================================
# VERBOSE LOGGING
# Shows detailed download progress
# ============================================
org.gradle.console=verbose
org.gradle.logging.level=lifecycle
