name: smartcare_plus
description: AI-Powered Elderly Care Ecosystem - SMARTCARE+ Mobile Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.9
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  # NOTE: firebase_storage disabled - using local storage (payment issue)
  # firebase_storage: ^11.6.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP & WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0

  # Camera & Media
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  # video_player removed - using custom MJPEG streaming instead

  # ML Kit for Pose Detection
  google_mlkit_pose_detection: ^0.10.0

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  permission_handler: ^11.2.0
  url_launcher: ^6.2.3
  path_provider: ^2.1.2

  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconly: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # NOTE: Videos moved to backend/media/simulation_footage/guardian/
    # They are now served via the backend API at /api/guardian/video/{video_id}

  # NOTE: Using google_fonts package for Orbitron and Exo2 fonts
  # No local font files needed - fonts are downloaded at runtime
